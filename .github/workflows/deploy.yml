name: Deploy

# Publishes the built client to GitHub Pages on every push to main, then runs
# the M0 and M1 walkthroughs against the public address.
#
# One-time setup: in the repository settings, Pages, set Source to
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits rather than cancelling a deploy
# half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  walkthrough:
    needs: deploy
    runs-on: ubuntu-latest
    # Both walkthroughs, one after the other, each on WebGPU and WebGL 2.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
      - name: Walkthrough against the public address
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: BASE_URL="${PAGE_URL%/}/" xvfb-run -a pnpm e2e --project walkthrough
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-public
          path: walkthrough-screenshots
          retention-days: 30
