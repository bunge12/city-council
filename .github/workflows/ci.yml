name: CI

# Runs on pull requests only. main requires branches to be up to date before
# merging, so a passing PR is already the merged result, and deploy.yml builds
# and walks through every push to main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the full check needs to run. A pull request that only
  # touches Markdown files skips it. The check job is skipped through `if:`
  # rather than `paths-ignore`, because GitHub reports a skipped job as passing
  # and a required check that never starts would block the merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its two parents.
          fetch-depth: 2
      - id: diff
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown files changed, skipping the check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm soak
      - run: pnpm bench
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # The M0 walkthrough runs headed (see playwright.config.ts), so give it a display.
      - run: xvfb-run -a pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough
          path: |
            walkthrough-screenshots
            packages/client/soak-report.json
            packages/sim/bench-results
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
