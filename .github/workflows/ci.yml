name: CI

# Runs on every pull request and on every push to main. main does not require
# branches to be up to date before merging (issue #219): with several pull
# requests open, that sent each of them through a rebase and a full run after
# every merge. A pull request's run tests it merged with main as main stood at
# its last push. The run on main tests the merged result, and when it fails
# the `report` job opens an issue naming the commit. deploy.yml also builds
# and walks through every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every commit on main
# gets a run of its own, so a failure names the merge that caused it.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the tests need to run. A pull request or a push to main
  # that only touches Markdown files skips them. The jobs are skipped through
  # `if:` rather than `paths-ignore`, because a required check that never
  # starts would block the merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its two parents, or the pushed
          # commit and the one before it.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push to main diffs against what main was before the push, which
          # covers a push of more than one commit. A new branch has no before.
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
              || ! git fetch --depth=1 origin "$BEFORE"; then
              echo "No commit before the push, running the check."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$BEFORE
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown files changed, skipping the check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # The Playwright version in the lockfile, for the e2e jobs' container.
      # A job's container is chosen before its steps run, so it is read here.
      - id: playwright
        run: |
          version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9][^']*" pnpm-lock.yaml)
          [ -n "$version" ] || { echo "No @playwright/test in pnpm-lock.yaml"; exit 1; }
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Lint, sim tests, soak, bench and build, a job each so they run side by
  # side (issue #230). In one job, one after another, they took about 6.5
  # minutes on an EPYC 9V45 runner and 9.5 to 10.5 on an EPYC 7763 (issue
  # #220). Apart, test and bench take about 2.5 to 3 minutes each on the
  # first CI run, so 10 minutes is still twice the slowest on a 7763.
  lint-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  soak:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A missed budget runs the soak once more (issue #231), so a job can
    # take twice its usual time and still pass.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The machine, as the e2e jobs print it (e2e/file-times-reporter.ts):
      # runners on the same image are not the same speed, and the bench and
      # soak hold steps to the 20 ms tick (issue #154).
      - run: |
          node -e "const os = require('os'); const c = os.cpus(); console.log('machine: ' + c.length + ' x ' + c[0].model + ', ' + Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      # A missed budget runs the soak once more, and the job fails only when
      # the second hour misses as well (scripts/budget-retry.mjs, issue
      # #231). The first hour's report is kept as soak-report.attempt-1.json.
      - run: pnpm soak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: packages/client/soak-report*.json
          retention-days: 30

  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A missed budget runs the bench once more (issue #231), so a job can
    # take twice its usual time and still pass.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The machine, as the e2e jobs print it (e2e/file-times-reporter.ts):
      # runners on the same image are not the same speed, and the bench and
      # soak hold steps to the 20 ms tick (issue #154).
      - run: |
          node -e "const os = require('os'); const c = os.cpus(); console.log('machine: ' + c.length + ' x ' + c[0].model + ', ' + Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      # A bench file that misses a budget runs once more, and the job fails
      # only when it misses again (scripts/budget-retry.mjs, issue #231).
      # The first attempt's results are kept in bench-results/attempt-1/.
      - run: pnpm bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: packages/sim/bench-results
          retention-days: 30

  # The Playwright suite, split over runners. The runners have no GPU, so
  # every page is drawn in software and the suite is bound by CPU: more
  # workers on one runner do not help, more runners do.
  #
  # The perf and evidence projects are not here: they measure and take
  # pictures, and run in perf.yml without blocking a merge (issue #225).
  #
  # Each job runs one project with `--no-deps`. The dependencies between
  # projects in playwright.config.ts only keep them from sharing a machine,
  # and here each has its own.
  #
  # The chromium runners get their spec files from scripts/e2e-shard.mjs,
  # which deals them out by how long each took on CI (e2e/projects.json).
  # Playwright's `--shard` deals out the same number of tests to each, and
  # one runner took 13 to 17 minutes while another took one. A new spec
  # file is picked up without a change here, at a guessed length until its
  # seconds are added.
  #
  # The jobs run in the Playwright image for the version in the lockfile. It
  # has Chromium, its system packages and xvfb, so a job installs nothing
  # from apt: on a slow Ubuntu mirror that took up to 7.6 minutes (issue
  # #221). The image is pinned, where ubuntu-latest moves. Chromium finds
  # SwiftShader's Vulkan in its own build, so the headed WebGPU projects get
  # the same software adapter as on the bare runner.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # Chromium's shared memory, as Playwright's Docker guide asks.
      options: --ipc=host
    # A runner planned at about eight to ten minutes takes twice that on a
    # slow machine, and a test that fails once is run again. 35 minutes leaves
    # room for both. Playwright stops the run before that (--global-timeout
    # below), so a run that hangs still ends with its report. The M2
    # walkthrough takes its own limit (see its matrix entry).
    # scripts/check-e2e-timeouts.mjs, in `pnpm lint`, reads these limits and
    # fails on a test allowed more than a third of its job (issue #228).
    timeout-minutes: ${{ matrix.timeout || 35 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One worker each, like the roads project. With two, the heavy
          # tests (two tabs drawing the whole map, the forest) starve the
          # page in the other worker on a slow runner, and its locators and
          # screenshots time out.
          #
          # Six shards, each planned at about eight minutes. Issue #152 went
          # from six to eight because runners on the same image are not the
          # same speed, and on a slow one the same files took 1.5 to 2 times
          # as long. Issue #225 then moved the perf and evidence specs, about
          # 2,250 planned seconds, to .github/workflows/perf.yml, which does
          # not gate a merge. The shard script balances on seconds measured
          # on CI, slow runners and fast ones alike.
          - { id: chromium-1, files: "1/6", args: "--project chromium --workers=1" }
          - { id: chromium-2, files: "2/6", args: "--project chromium --workers=1" }
          - { id: chromium-3, files: "3/6", args: "--project chromium --workers=1" }
          - { id: chromium-4, files: "4/6", args: "--project chromium --workers=1" }
          - { id: chromium-5, files: "5/6", args: "--project chromium --workers=1" }
          - { id: chromium-6, files: "6/6", args: "--project chromium --workers=1" }
          # One worker: software WebGPU takes most of a runner's CPU. In CI
          # the roads project is fully parallel, so its one file is dealt
          # out test by test.
          #
          # A runner without `files` gives its Playwright run's time limit in
          # `limit`, in minutes. scripts/check-e2e-timeouts.mjs holds it to
          # every attempt of its longest test plus two minutes, and to three
          # minutes under the job's limit. The roads runners took up to 6
          # minutes on CI, the walkthroughs up to 2.3 (M0), 7 (M1) and 19.5 (M2).
          - { id: roads-1, limit: 12, args: "--project roads --no-deps --workers=1 --shard=1/3" }
          - { id: roads-2, limit: 12, args: "--project roads --no-deps --workers=1 --shard=2/3" }
          - { id: roads-3, limit: 12, args: "--project roads --no-deps --workers=1 --shard=3/3" }
          # The M0, M1 and M2 walkthroughs on runners of their own: each
          # runs on WebGPU in software, which takes most of a runner's CPU.
          - { id: walkthrough-m0, limit: 15, args: "--project walkthrough --no-deps -g \"M0 walkthrough\"" }
          - { id: walkthrough-m1, limit: 25, args: "--project walkthrough --no-deps -g \"M1 walkthrough\"" }
          # About 7.5 minutes on software WebGPU and 3 on WebGL 2 on a 4-core
          # container, with waits on the grower's draws in steps 3 and 5. A
          # slow runner takes twice that and a failed test runs again, which
          # 35 minutes does not hold.
          - { id: walkthrough-m2, timeout: 60, limit: 48, args: "--project walkthrough --no-deps -g \"M2 walkthrough\"" }
    name: e2e (${{ matrix.id }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The roads and walkthrough projects run headed (see
      # playwright.config.ts), so give them a display. Only the walkthrough
      # needs the production build served.
      - env:
          ARGS: ${{ matrix.args }}
          FILES: ${{ matrix.files }}
          LIMIT: ${{ matrix.limit }}
          E2E_DEV_SERVER_ONLY: ${{ startsWith(matrix.id, 'walkthrough') && '0' || '1' }}
          # The M0 walkthrough prints its cold load here and does not hold it
          # to 5 s: on the slowest runners it has 1.3 times headroom, less than
          # the spread between runners (issue #154). deploy.yml and
          # nightly.yml hold it, where a failure does not block a merge.
          E2E_LOAD_BUDGET: report
          # The zone tool's 50 ms task budget on the scale town is printed, not
          # held: the slowest runners leave it less than two times headroom.
          # A task over 200 ms still fails (issue #163).
          E2E_TASK_BUDGET: report
        run: |
          files=""
          if [ -n "$FILES" ]; then
            files=$(node scripts/e2e-shard.mjs "$FILES")
            echo "Spec files: $files"
            limit=$(node scripts/e2e-shard.mjs "$FILES" --global-timeout)
          else
            limit=$((LIMIT * 60000))
          fi
          echo "Playwright stops this run after $((limit / 60000)) minutes."
          eval "xvfb-run -a pnpm e2e $ARGS --global-timeout=$limit $files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && startsWith(matrix.id, 'walkthrough')
        with:
          name: ${{ matrix.id }}
          path: walkthrough-screenshots
          retention-days: 30
      # Uploaded whatever the result (issue #228): a passing run's report
      # shows a flaky test's failed first attempt, and test-results holds
      # its trace and screenshot, and any file a test writes. A job that
      # GitHub stops at timeout-minutes ends as cancelled, and steps under
      # `always()` still run then (issue #220), as they do when a newer push
      # cancels the run, which only costs an upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # The one required check. It passes when every job above passed, or when
  # the change is Markdown only and they were skipped.
  #
  # It does not run when the run itself was cancelled, which is what a new
  # push or "Update branch" does to the run in flight (cancel-in-progress
  # above). Under `always()` it ran anyway, saw the cancelled jobs and failed,
  # leaving a red check on a run that was only replaced (issue #220). A job
  # stopped at its time limit does not cancel the run, so this still runs
  # and fails on it.
  check:
    needs: [changes, lint-build, test, soak, bench, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT_BUILD: ${{ needs.lint-build.result }}
          TEST: ${{ needs.test.result }}
          SOAK: ${{ needs.soak.result }}
          BENCH: ${{ needs.bench.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES (code=$CODE), lint-build: $LINT_BUILD, test: $TEST, soak: $SOAK, bench: $BENCH, e2e: $E2E"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then
            for result in "$LINT_BUILD" "$TEST" "$SOAK" "$BENCH" "$E2E"; do
              [ "$result" = success ] || exit 1
            done
          fi

  # On main only: when the check fails, open an issue that names the merge, or
  # comment on the one already open so a broken main does not open one issue
  # per merge. Two pull requests that each pass alone can fail together.
  report:
    needs: check
    if: always() && github.event_name == 'push' && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failed on main"
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          body=$(printf 'CI failed on `main` at %s, "%s".\n\nRun: %s\n\nThe pull request passed on its own, so it most likely conflicts with one merged since its last push. Fix it on `main` before merging more.' "$SHA" "$subject" "$RUN_URL")
          # The label marks these issues for whoever triages them. --force
          # makes the call a no-op when the label is already there.
          label="CI Failure"
          gh label create "$label" --color B60205 --description "CI failed on main" --force
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
            gh issue edit "$open" --add-label "$label"
          else
            gh issue create --title "$title: $subject" --body "$body" --label "$label"
          fi
