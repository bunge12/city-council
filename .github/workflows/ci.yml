name: CI

# Runs on every pull request and on every push to main. main does not require
# branches to be up to date before merging (issue #219): with several pull
# requests open, that sent each of them through a rebase and a full run after
# every merge. A pull request's run tests it merged with main as main stood at
# its last push. The run on main tests the merged result, and when it fails
# the `report` job opens an issue naming the commit. deploy.yml also builds
# and walks through every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every commit on main
# gets a run of its own, so a failure names the merge that caused it.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the tests need to run. A pull request or a push to main
  # that only touches Markdown files skips them. The jobs are skipped through
  # `if:` rather than `paths-ignore`, because a required check that never
  # starts would block the merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its two parents, or the pushed
          # commit and the one before it.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push to main diffs against what main was before the push, which
          # covers a push of more than one commit. A new branch has no before.
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
              || ! git fetch --depth=1 origin "$BEFORE"; then
              echo "No commit before the push, running the check."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$BEFORE
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown files changed, skipping the check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # The Playwright version in the lockfile, for the e2e jobs' container.
      # A job's container is chosen before its steps run, so it is read here.
      - id: playwright
        run: |
          version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9][^']*" pnpm-lock.yaml)
          [ -n "$version" ] || { echo "No @playwright/test in pnpm-lock.yaml"; exit 1; }
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Lint, sim tests, soak, bench and build, a job each so they run side by
  # side (issue #230). In one job, one after another, they took about 6.5
  # minutes on an EPYC 9V45 runner and 9.5 to 10.5 on an EPYC 7763 (issue
  # #220). Apart, test and bench take about 2.5 to 3 minutes each on the
  # first CI run, so 10 minutes is still twice the slowest on a 7763.
  lint-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  soak:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A missed budget runs the soak once more (issue #231), so a job can
    # take twice its usual time and still pass.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The machine, as the e2e jobs print it (e2e/file-times-reporter.ts):
      # runners on the same image are not the same speed, and the bench and
      # soak hold steps to the 20 ms tick (issue #154).
      - run: |
          node -e "const os = require('os'); const c = os.cpus(); console.log('machine: ' + c.length + ' x ' + c[0].model + ', ' + Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      # A missed budget runs the soak once more, and the job fails only when
      # the second hour misses as well (scripts/budget-retry.mjs, issue
      # #231). The first hour's report is kept as soak-report.attempt-1.json.
      - run: pnpm soak
      # Every held figure against its budget in packages/sim/balance/budgets.json,
      # with its headroom, in the job summary. A figure under 1.5x headroom
      # gets a warning annotation (issue #232).
      - if: always()
        run: node scripts/budget-table.mjs --title Soak --out budget-table.jsonl packages/client/budget-rows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: packages/client/soak-report*.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: budget-table-soak
          path: budget-table.jsonl
          if-no-files-found: ignore
          retention-days: 7

  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The bench runs once on the code before the change and then on the
    # change, where a missed budget runs it once more (issue #231), so a job
    # can take three times one bench and still pass. One bench takes about
    # 3 minutes, and up to 5 on the slowest runners.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent: main as it stood for
          # a pull request's merge commit, the commit before for a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The machine, as the e2e jobs print it (e2e/file-times-reporter.ts):
      # runners on the same image are not the same speed, and the bench and
      # soak hold steps to the 20 ms tick (issue #154).
      - run: |
          node -e "const os = require('os'); const c = os.cpus(); console.log('machine: ' + c.length + ' x ' + c[0].model + ', ' + Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      # The same bench on the code before the change, on this runner (issue
      # #319). Runners differ by a factor of two, so a figure near its
      # budget misses on the slow ones whatever the change did: from 22 to
      # 23 November 2026 jobs.tick failed five pull requests that had not
      # touched it. With the base's figures beside it, a case over its
      # budget fails the change only when the change made it slower
      # (`judgeBudget`); one that was over already is a warning. This step
      # never fails the job: with no base figures every budget is absolute,
      # as before.
      - name: Bench the code before the change
        continue-on-error: true
        run: |
          : > "$RUNNER_TEMP/base-rows.jsonl"
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          # Its own misses are its own: only its figures are wanted, from
          # one attempt, and nothing of it in this job's summary.
          BUDGET_NO_RETRY=1 env -u GITHUB_STEP_SUMMARY pnpm bench || echo "The base's bench did not pass."
          cat packages/*/budget-rows/attempt-*.jsonl > "$RUNNER_TEMP/base-rows.jsonl"
          echo "$(wc -l < "$RUNNER_TEMP/base-rows.jsonl") base figures from $(git rev-parse HEAD)"
      # A bench file that misses a budget runs once more, and the job fails
      # only when it misses again (scripts/budget-retry.mjs, issue #231).
      # The first attempt's results are kept in bench-results/attempt-1/.
      - run: BUDGET_BASE="$RUNNER_TEMP/base-rows.jsonl" pnpm bench
      # As in the soak job: every held figure and its headroom (issue #232).
      - if: always()
        run: node scripts/budget-table.mjs --title Bench --out budget-table.jsonl packages/sim/budget-rows packages/client/budget-rows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: packages/sim/bench-results
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: budget-table-bench
          path: budget-table.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # On main only: appends the bench's and the soak's budget rows to
  # budgets.jsonl on the `budget-history` branch, one JSON line a figure a
  # run, with the commit, the run and the runner's CPU, so the headroom of
  # each figure can be drawn over time per CPU model (issue #232). It runs
  # when either job ran, passed or failed, and gates nothing: `check` does
  # not need it. Two runs on main can push at once, so a rejected push
  # starts again from the branch as it now stands.
  budget-history:
    needs: [bench, soak]
    if: >-
      always() && github.event_name == 'push' &&
      (needs.bench.result == 'success' || needs.bench.result == 'failure' ||
      needs.soak.result == 'success' || needs.soak.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This run's rows. A run whose jobs wrote none has no such
          # artifact, and says so; any other failure to download fails here.
          if ! gh run download "$RUN_ID" --pattern 'budget-table-*' --dir rows 2> download.err; then
            if grep -q "no valid artifacts" download.err; then
              echo "No budget rows in this run."
              exit 0
            fi
            cat download.err
            exit 1
          fi
          files=(rows/*/budget-table.jsonl)
          # A figure over its budget that the push did not slow fails no
          # run (issue #319), so it gets one open issue instead: opened
          # when there is none, and left alone when there is, so a slow
          # runner does not write a comment a push. It blocks nothing.
          over=$(node -e '
            const fs = require("fs");
            const rows = process.argv.slice(1).flatMap((f) => fs.readFileSync(f, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l)));
            for (const r of rows.filter((r) => r.inherited)) console.log(`- \`${r.figure}\`, ${r.case}: ${r.statistic} ${Number(r.measured.toPrecision(3))} against ${r.budget} on ${r.cpu}`);
          ' "${files[@]}") || over=""
          if [ -n "$over" ]; then
            echo "Over budget, as before this push:"
            echo "$over"
            title="A time budget is over on main"
            # None of this may stop the rows below from being kept.
            open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || echo unknown)
            if [ -z "$open" ]; then
              gh label create "Budget" --color D93F0B --description "A held time budget is over on main" --force || true
              gh issue create --title "$title" --label "Budget" --body "$(printf 'At %s these figures were over their budgets in `packages/sim/balance/budgets.json`, and no slower than on the commit before, so the run passed (issue #319).\n\n%s\n\nRun: %s\n\nThis blocks no merge. Make the code faster or move the budget, and close this when the bench job summary on `main` shows none marked "over, as before". The `budget-history` branch has every figure over time for each CPU.' "$SHA" "$over" "$RUN_URL")" || echo "Could not open the issue."
            else
              echo "Issue #$open is already open for it."
            fi
          fi
          branch=budget-history
          url="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          for try in 1 2 3 4; do
            [ "$try" -gt 1 ] && sleep $((try * 5))
            rm -rf history
            if git ls-remote --exit-code --heads "$url" "$branch" > /dev/null; then
              git clone --quiet --depth 1 --branch "$branch" "$url" history || continue
            else
              git init --quiet -b "$branch" history
              git -C history remote add origin "$url"
              printf '%s\n' \
                "# Budget history" \
                "" \
                "Written by the budget-history job in .github/workflows/ci.yml on main (issue #232). Do not edit by hand." \
                "" \
                "budgets.jsonl has one JSON line for each held figure on each CI run on main: date, sha, run, job, cpu, figure, case, statistic, unit, measured, budget, headroom, mode, pass and attempt." \
                > history/README.md
            fi
            # Leaves out a job of this run already in the file, as after "Re-run failed jobs".
            added=$(node scripts/budget-append.mjs history/budgets.jsonl "${files[@]}")
            git -C history add -A
            if git -C history diff --cached --quiet; then
              echo "Nothing new to append."
              exit 0
            fi
            git -C history -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Budgets from run $RUN_ID at $SHA"
            if git -C history push --quiet origin "$branch"; then
              echo "Appended $added rows to $branch."
              exit 0
            fi
            echo "Push failed, trying again ($try)."
          done
          exit 1

  # The Playwright suite, split over runners. The runners have no GPU, so
  # every page is drawn in software and the suite is bound by CPU: more
  # workers on one runner do not help, more runners do.
  #
  # The perf and evidence projects are not here: they measure and take
  # pictures, and run in perf.yml without blocking a merge (issue #225).
  #
  # Each job runs one project with `--no-deps`. The dependencies between
  # projects in playwright.config.ts only keep them from sharing a machine,
  # and here each has its own.
  #
  # The chromium runners get their spec files from scripts/e2e-shard.mjs,
  # which deals them out by how long each took on CI (e2e/projects.json).
  # Playwright's `--shard` deals out the same number of tests to each, and
  # one runner took 13 to 17 minutes while another took one. The roads
  # runners get their tests the same way, by each test's seconds. A new spec
  # file or roads test is picked up without a change here, and fails the
  # job until e2e/projects.json has its seconds (issue #229).
  #
  # Each job uploads e2e-times.json (e2e/file-times-reporter.ts), its CPU
  # and the seconds of each file and test. The `e2e-summary` job puts them in
  # the run's summary, and the weekly e2e timings run
  # (.github/workflows/e2e-timings.yml) turns them into the seconds in
  # e2e/projects.json and the "Flaky tests" issue.
  #
  # The jobs run in the Playwright image for the version in the lockfile. It
  # has Chromium, its system packages and xvfb, so a job installs nothing
  # from apt: on a slow Ubuntu mirror that took up to 7.6 minutes (issue
  # #221). The image is pinned, where ubuntu-latest moves. Chromium finds
  # SwiftShader's Vulkan in its own build, so the headed WebGPU projects get
  # the same software adapter as on the bare runner.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # Chromium's shared memory, as Playwright's Docker guide asks.
      options: --ipc=host
    # A runner planned at about eight to ten minutes takes twice that on a
    # slow machine, and a test that fails once is run again. 35 minutes leaves
    # room for both. Playwright stops the run before that (--global-timeout
    # below), so a run that hangs still ends with its report. The M2
    # walkthrough takes its own limit (see its matrix entry).
    # scripts/check-e2e-timeouts.mjs, in `pnpm lint`, reads these limits and
    # fails on a test allowed more than a third of its job (issue #228).
    timeout-minutes: ${{ matrix.timeout || 35 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One worker each, like the roads project. With two, the heavy
          # tests (two tabs drawing the whole map, the forest) starve the
          # page in the other worker on a slow runner, and its locators and
          # screenshots time out.
          #
          # Six shards, each planned at about eight minutes. Issue #152 went
          # from six to eight because runners on the same image are not the
          # same speed, and on a slow one the same files took 1.5 to 2 times
          # as long. Issue #225 then moved the perf and evidence specs, about
          # 2,250 planned seconds, to .github/workflows/perf.yml, which does
          # not gate a merge. The shard script balances on seconds measured
          # on CI, slow runners and fast ones alike.
          - { id: chromium-1, project: chromium, files: "1/6", args: "--workers=1" }
          - { id: chromium-2, project: chromium, files: "2/6", args: "--workers=1" }
          - { id: chromium-3, project: chromium, files: "3/6", args: "--workers=1" }
          - { id: chromium-4, project: chromium, files: "4/6", args: "--workers=1" }
          - { id: chromium-5, project: chromium, files: "5/6", args: "--workers=1" }
          - { id: chromium-6, project: chromium, files: "6/6", args: "--workers=1" }
          # One worker: software WebGPU takes most of a runner's CPU. Its
          # three files are dealt out test by test, by each test's seconds.
          #
          # A runner without `files` gives its Playwright run's time limit in
          # `limit`, in minutes. scripts/check-e2e-timeouts.mjs holds it to
          # every attempt of its longest test plus two minutes, and to three
          # minutes under the job's limit. The walkthroughs took up to 2.3
          # (M0), 7 (M1) and 19.5 (M2) minutes on CI.
          - { id: roads-1, project: roads, files: "1/3", args: "--no-deps --workers=1" }
          - { id: roads-2, project: roads, files: "2/3", args: "--no-deps --workers=1" }
          - { id: roads-3, project: roads, files: "3/3", args: "--no-deps --workers=1" }
          # The M0, M1 and M2 walkthroughs on runners of their own: each
          # runs on WebGPU in software, which takes most of a runner's CPU.
          - { id: walkthrough-m0, project: walkthrough, limit: 15, args: "--no-deps -g \"M0 walkthrough\"" }
          - { id: walkthrough-m1, project: walkthrough, limit: 25, args: "--no-deps -g \"M1 walkthrough\"" }
          # About 7.5 minutes on software WebGPU and 3 on WebGL 2 on a 4-core
          # container, with waits on the grower's draws in steps 3 and 5. A
          # slow runner takes twice that and a failed test runs again, which
          # 35 minutes does not hold.
          - { id: walkthrough-m2, project: walkthrough, timeout: 60, limit: 48, args: "--no-deps -g \"M2 walkthrough\"" }
    name: e2e (${{ matrix.id }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The roads and walkthrough projects run headed (see
      # playwright.config.ts), so give them a display. Only the walkthrough
      # needs the production build served.
      - env:
          PROJECT: ${{ matrix.project }}
          ARGS: ${{ matrix.args }}
          FILES: ${{ matrix.files }}
          LIMIT: ${{ matrix.limit }}
          # Which runner this was and its share, for e2e-times.json.
          E2E_RUNNER: ${{ matrix.id }}
          E2E_SHARD: ${{ matrix.files }}
          E2E_DEV_SERVER_ONLY: ${{ startsWith(matrix.id, 'walkthrough') && '0' || '1' }}
          # The M0 walkthrough prints its cold load here and does not hold it
          # to 5 s: on the slowest runners it has 1.3 times headroom, less than
          # the spread between runners (issue #154). deploy.yml and
          # nightly.yml hold it, where a failure does not block a merge.
          E2E_LOAD_BUDGET: report
          # The zone tool's 50 ms task budget on the scale town is printed, not
          # held: the slowest runners leave it less than two times headroom.
          # A task over 200 ms still fails (issue #163).
          E2E_TASK_BUDGET: report
        run: |
          files=""
          if [ -n "$FILES" ]; then
            files=$(node scripts/e2e-shard.mjs "$FILES" --project "$PROJECT" --planned-out e2e-planned.txt)
            echo "Spec files: $files"
            [ ! -f e2e-test-list.txt ] || { echo "Tests:"; cat e2e-test-list.txt; }
            E2E_PLANNED_SECONDS=$(cat e2e-planned.txt)
            export E2E_PLANNED_SECONDS
            limit=$(node scripts/e2e-shard.mjs "$FILES" --project "$PROJECT" --global-timeout)
          else
            limit=$((LIMIT * 60000))
          fi
          echo "Playwright stops this run after $((limit / 60000)) minutes."
          eval "xvfb-run -a pnpm e2e --project \"\$PROJECT\" $ARGS --global-timeout=$limit $files"
      # Under `cancelled()` too, for a job stopped at its time limit: a
      # reporter that never reached its end writes nothing, and the upload
      # finds no file. An upload that fails does not fail the job: the
      # times gate nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: e2e-times-${{ matrix.id }}
          path: e2e-times.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && startsWith(matrix.id, 'walkthrough')
        with:
          name: ${{ matrix.id }}
          path: walkthrough-screenshots
          retention-days: 30
      # Uploaded whatever the result (issue #228): a passing run's report
      # shows a flaky test's failed first attempt, and test-results holds
      # its trace and screenshot, and any file a test writes. A job that
      # GitHub stops at timeout-minutes ends as cancelled, and steps under
      # `always()` still run then (issue #220), as they do when a newer push
      # cancels the run, which only costs an upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # The e2e jobs' times in the run summary: each runner's minutes against
  # its plan, and every test that needed a retry, which otherwise leaves its
  # job green (issue #229). It runs when a job failed or hit its time limit
  # too, and gates nothing.
  e2e-summary:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --pattern 'e2e-times-*' --dir e2e-times || echo "No e2e job uploaded its times."
          mkdir -p e2e-times
          node scripts/e2e-report.mjs e2e-times | tee -a "$GITHUB_STEP_SUMMARY"

  # The one required check. It passes when every job above passed, or when
  # the change is Markdown only and they were skipped.
  #
  # It does not run when the run itself was cancelled, which is what a new
  # push or "Update branch" does to the run in flight (cancel-in-progress
  # above). Under `always()` it ran anyway, saw the cancelled jobs and failed,
  # leaving a red check on a run that was only replaced (issue #220). A job
  # stopped at its time limit does not cancel the run, so this still runs
  # and fails on it.
  check:
    needs: [changes, lint-build, test, soak, bench, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT_BUILD: ${{ needs.lint-build.result }}
          TEST: ${{ needs.test.result }}
          SOAK: ${{ needs.soak.result }}
          BENCH: ${{ needs.bench.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES (code=$CODE), lint-build: $LINT_BUILD, test: $TEST, soak: $SOAK, bench: $BENCH, e2e: $E2E"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then
            for result in "$LINT_BUILD" "$TEST" "$SOAK" "$BENCH" "$E2E"; do
              [ "$result" = success ] || exit 1
            done
          fi

  # On main only: when the check fails, open an issue that names the merge, or
  # comment on the one already open so a broken main does not open one issue
  # per merge. Two pull requests that each pass alone can fail together.
  # deploy.yml and nightly.yml report their failures the same way, through
  # scripts/report-failure.sh (issue #233).
  report:
    needs: check
    if: always() && github.event_name == 'push' && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUBJECT=$(printf '%s\n' "$MESSAGE" | head -n 1) scripts/report-failure.sh "CI failed on main" "CI Failure" "CI failed on main" \
            "CI failed on \`main\`" \
            "The pull request passed on its own, so it most likely conflicts with one merged since its last push. Fix it on \`main\` before merging more."
