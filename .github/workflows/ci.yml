name: CI

# Runs on pull requests only. main requires branches to be up to date before
# merging, so a passing PR is already the merged result, and deploy.yml builds
# and walks through every push to main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm soak
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # The M0 walkthrough runs headed (see playwright.config.ts), so give it a display.
      - run: xvfb-run -a pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough
          path: |
            walkthrough-screenshots
            packages/client/soak-report.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
