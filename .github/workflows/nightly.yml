name: Nightly

# The M0 walkthrough against the public address once a night, holding the
# cold load to its 5 s budget. Pull request CI prints the load and does not
# hold it, since on the slowest runners it has about 1.3 times headroom, less
# than the spread between runners (issue #154). deploy.yml holds it after
# every push to main; this run catches a slow load on days with no push. It
# also holds the zone tool's 50 ms task budget on the scale town, which pull
# request CI prints for the same reason (issue #163). A failure here opens an
# issue (the `report` job below, issue #233) and blocks nothing.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Playwright version in the lockfile, for the jobs' container (see the
  # e2e job in ci.yml). A job's container is chosen before its steps run.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        run: |
          version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9][^']*" pnpm-lock.yaml)
          [ -n "$version" ] || { echo "No @playwright/test in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  load-budget:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: M0 walkthrough against the public address
        run: BASE_URL="https://bunge12.github.io/city-council/" xvfb-run -a pnpm e2e --project walkthrough --workers=1 -g "M0 walkthrough"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: walkthrough-m0-nightly
          path: walkthrough-screenshots
          retention-days: 14

  zone-tool-task-budget:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Opening the zone tool on the scale town, every task under 50 ms
        env:
          E2E_DEV_SERVER_ONLY: "1"
        run: xvfb-run -a pnpm e2e --project chromium --workers=1 e2e/zone-open-scale.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zone-open-nightly
          path: test-results/zone-open-report.json
          retention-days: 14

  # When a job above failed, open an issue that names the commit, or comment
  # on the one already open (scripts/report-failure.sh).
  report:
    needs: [playwright, load-budget, zone-tool-task-budget]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOAD: ${{ needs.load-budget.result }}
          ZONE: ${{ needs.zone-tool-task-budget.result }}
        run: |
          scripts/report-failure.sh "Nightly failed" "Nightly Failure" "The nightly load or task budget run failed" \
            "The nightly run failed on \`main\`" \
            "load-budget (M0 cold load under 5 s on the public address): $LOAD, zone-tool-task-budget (zone tool tasks under 50 ms on the scale town): $ZONE. Pull request CI only prints these budgets (issues #154 and #163). This blocks no merge."
